<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The software factory</title>
    <link rel="stylesheet" href="animation/player.css">
    <script type="importmap">
      {
        "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" },
        "integrity": { "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js": "sha384-GY5FqjttLCFRt/McQbyaVdCk2O1IQtOeX8Py6NfD89BIAsIyJFRl4UgSXrk2vXAk" }
      }
    </script>
  </head>
  <body>
    <main>
      <div id="screen">
        <canvas id="stage" role="img" aria-label="The software factory, an animated silent film"></canvas>
        <p id="card" hidden></p>
      </div>
      <div class="controls">
        <button id="play" type="button" aria-label="Play">▶</button>
        <button id="restart" type="button" aria-label="Restart">↺</button>
        <input id="progress" type="range" min="0" step="0.1" value="0" aria-label="Position in the film">
        <span id="clock">0:00 / 0:00</span>
      </div>
      <p id="error" role="alert"></p>
    </main>
    <script type="module" src="animation/player.js"></script>
  </body>
</html>
