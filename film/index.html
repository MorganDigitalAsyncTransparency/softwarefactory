<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The software factory</title>
    <link rel="stylesheet" href="animation/player.css">
  </head>
  <body>
    <main>
      <svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="The software factory, an animated silent film"></svg>
      <div class="controls">
        <button id="play" type="button" aria-label="Play">▶</button>
        <button id="restart" type="button" aria-label="Restart">↺</button>
        <input id="progress" type="range" min="0" max="120" step="0.1" value="0" aria-label="Position in the film">
        <span id="clock">0:00 / 0:00</span>
      </div>
      <p id="error" role="alert"></p>
    </main>
    <script type="module" src="animation/player.js"></script>
  </body>
</html>
